[package]
name = "cs2clips-core"
description = "Highlight detection, share codes, Steam match history and montage pipeline for CS2 Clips"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["parser", "net"]
parser = ["dep:source2-demo"]
net = ["dep:ureq"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_yaml = "0.9"
num-bigint = "0.4"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
directories = "6"
ureq = { version = "3", optional = true }
source2-demo = { version = "0.5", features = ["cs2"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
