[package]
name = "cs2clips-site"
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Navigator", "Clipboard"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
