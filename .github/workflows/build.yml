name: test-and-build
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
permissions: {contents: write}
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pytest -q
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name CS2Clips --collect-all demoparser2 --collect-all tkinterdnd2 --add-data "rules.example.yaml;." run_app.py
      - uses: actions/upload-artifact@v4
        with: {name: CS2Clips, path: dist/CS2Clips.exe}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: dist/CS2Clips.exe, generate_release_notes: true}
